<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style><title>Sztuka Barber Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,500;100,600;125,600;125,700;125,800&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=swap">
<style>
/* Sztuka brand: monochrome black, neon sign as the one bold moment; booking = drawer over their site. */
:root{
  color-scheme:dark;
  --bg:#0d0d0d; --bg-2:#131313; --surface:#181818; --surface-2:#202020; --line:#2c2c2c; --line-2:#3d3d3d;
  --fg:#f3f3f1; --fg-soft:#c9c9c5; --muted:#8f8f8a;
  --neon:#e9f0ff; --glow:150,185,255;
  --ok:#5cc28a; --ok-bg:#15291e; --warn:#e3a85a; --warn-bg:#2e2314; --new:#9ec1ff;
  --wide:"Archivo",Helvetica,Arial,sans-serif; --serif:"Bodoni Moda",Didot,"Times New Roman",serif;
  --t:220ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;font-feature-settings:"lnum","tnum"}
body{background:var(--bg);color:var(--fg);font-family:var(--wide);font-stretch:100%;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3{margin:0;font-stretch:125%;font-weight:700;text-transform:uppercase;letter-spacing:.06em;line-height:1.08;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--new);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
section{padding-block:clamp(56px,9vw,110px)}
.tag{font-size:.7rem;font-stretch:125%;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.mono{display:inline-grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:1.05rem;letter-spacing:.02em;border:1.5px solid var(--fg);padding:1px 7px 0;line-height:1.4}
.sec-head{text-align:center;max-width:62ch;margin:0 auto clamp(34px,5vw,54px);display:grid;justify-items:center;gap:14px}
.sec-head h2{font-size:clamp(1.6rem,4.6vw,2.6rem)}
.sec-head p{margin:0;color:var(--fg-soft);font-size:.95rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:12px 26px;border:1px solid var(--fg);font-size:.72rem;font-stretch:125%;font-weight:600;letter-spacing:.18em;text-transform:uppercase;transition:transform var(--t),background var(--t),color var(--t)}
.btn:hover:not(:disabled){background:var(--fg);color:var(--bg);transform:rotate(-1.5deg)}
.btn.fill{background:var(--fg);color:var(--bg)}
.btn.fill:hover:not(:disabled){background:transparent;color:var(--fg)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.sm{min-height:38px;padding:8px 16px;font-size:.66rem}
.btn.block{width:100%}

/* demo strip + header */
.strip{position:relative;z-index:31;background:#e9e7df;color:#141414;font-size:.76rem;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px 18px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.strip b{font-stretch:125%;letter-spacing:.08em}
.strip button{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.strip .pill{position:relative}
.badge{position:absolute;top:-8px;right:-14px;min-width:18px;height:18px;border-radius:9px;background:#141414;color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 5px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:32;background:var(--bg)}
.bar{display:flex;align-items:center;gap:22px;padding-block:14px}
.wm{font-family:var(--serif);font-weight:600;font-size:1.5rem;letter-spacing:.02em;line-height:1;margin-right:auto;display:inline-flex}
.wm span{border:1.5px solid var(--fg);border-right:none;padding:1px 0 0 4px;margin-right:-1px}
.nav{display:flex;gap:28px}
.nav a{font-size:.66rem;font-stretch:125%;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-soft);padding:6px 0;transition:color var(--t)}
.nav a:hover{color:var(--fg)}
@media(max-width:900px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line-2)}
.lang button{padding:6px 10px;font-size:.66rem;font-stretch:125%;font-weight:600;letter-spacing:.1em;color:var(--muted);min-height:32px}
.lang button.on{background:var(--fg);color:var(--bg)}
@media(max-width:560px){.bar .btn{display:none}.bar{gap:12px}}

/* hero */
.hero{position:relative;overflow:hidden;text-align:center;padding-block:clamp(56px,10vw,120px) clamp(40px,7vw,80px);background:
  radial-gradient(60% 55% at 50% 72%,rgba(var(--glow),.10),transparent 70%),
  radial-gradient(90% 70% at 50% 0%,#1b1b1b,var(--bg) 70%)}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);pointer-events:none}
.hero .mono{margin-bottom:22px}
.hero h1{font-size:clamp(1.9rem,6.4vw,4.4rem);font-weight:800;letter-spacing:.07em}
.hero p{max-width:58ch;margin:20px auto 0;color:var(--fg-soft);font-size:clamp(.92rem,1.6vw,1.05rem)}
.hero .cta{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:30px}
.hero .cta small{color:var(--muted);font-size:.74rem;letter-spacing:.04em}
.neon{position:relative;z-index:1;margin-top:clamp(30px,5vw,54px);font-family:var(--serif);font-weight:600;font-size:clamp(4.2rem,21vw,15rem);line-height:.9;letter-spacing:.02em;color:transparent;-webkit-text-stroke:1.6px rgba(240,245,255,.92);user-select:none;display:flex;justify-content:center}
.neon span{display:inline-block;filter:drop-shadow(0 0 2px rgba(var(--glow),1)) drop-shadow(0 0 10px rgba(var(--glow),.7)) drop-shadow(0 0 30px rgba(var(--glow),.45));animation:on 1.6s ease-out both,flick 7s linear infinite;animation-delay:calc(var(--i)*.14s),calc(1.6s + var(--i)*.9s)}
.neon span:nth-child(4){animation:on 1.6s ease-out both,buzz 4.3s linear infinite;animation-delay:.56s,2.4s}
@keyframes on{0%{opacity:0}10%{opacity:.9}14%{opacity:.1}22%{opacity:1}26%{opacity:.3}34%,100%{opacity:1}}
@keyframes flick{0%,91%,100%{opacity:1}92%{opacity:.45}93%{opacity:1}95%{opacity:.7}96%{opacity:1}}
@keyframes buzz{0%,100%{opacity:1}7%{opacity:.25}8%{opacity:1}9%{opacity:.4}10%,60%{opacity:1}61%{opacity:.6}62%{opacity:1}}
.neon-floor{height:40px;margin-top:-6px;background:radial-gradient(50% 100% at 50% 0%,rgba(var(--glow),.16),transparent 70%)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}
.stat{padding:clamp(20px,3vw,34px) 12px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat b{display:block;font-stretch:125%;font-weight:700;font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:.02em;line-height:1}
.stat span{display:block;margin-top:10px;font-size:.62rem;font-stretch:125%;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.stat .fix{display:block;margin-top:8px;font-size:.66rem;color:var(--ok);letter-spacing:.02em;text-transform:none;font-stretch:100%}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:none}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* salons */
.salons{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media(max-width:820px){.salons{grid-template-columns:1fr}}
.salon{background:var(--bg);padding:30px 26px;display:flex;flex-direction:column;gap:6px;transition:background var(--t)}
.salon:hover{background:var(--bg-2)}
.salon .city{font-size:.66rem;font-stretch:125%;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.salon h3{font-size:1.15rem;margin-top:4px}
.salon p{margin:0;color:var(--fg-soft);font-size:.88rem}
.salon .tel{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.84rem;margin-bottom:18px}
.salon .btn{margin-top:auto;align-self:flex-start}

/* price list */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,4vw,48px)}
@media(max-width:900px){.cats{grid-template-columns:1fr}}
.cat h3{font-size:.8rem;letter-spacing:.24em;color:var(--muted);padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.row .n{font-weight:500;font-size:.95rem}
.row .d{grid-column:1;color:var(--muted);font-size:.76rem}
.row .pr{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:12px}
.row .pr s{color:var(--muted);font-size:.76rem}
.row .pr b{font-stretch:125%;font-weight:700;font-size:1rem}
.row .pr button{width:34px;height:34px;border:1px solid var(--line-2);display:grid;place-items:center;transition:var(--t)}
.row .pr button:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row .pr svg{width:14px;height:14px}
.promo-note{text-align:center;color:var(--muted);font-size:.78rem;margin-top:26px}

/* owner section */
.owner{background:#f1efe9;color:#121212}
.owner .tag{color:#6b6a64}
.owner .mono{border-color:#121212}
.owner .sec-head p{color:#3d3c38}
.og{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#cfccc3;border:1px solid #cfccc3}
@media(max-width:860px){.og{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.og{grid-template-columns:1fr}}
.oi{background:#f1efe9;padding:26px 24px}
.oi .k{font-family:var(--serif);font-size:1.9rem;line-height:1;color:#121212}
.oi h3{font-size:.86rem;margin:14px 0 8px;letter-spacing:.1em}
.oi p{margin:0;font-size:.88rem;color:#3d3c38}
.oi.warn .k{color:#b0412e}
.try{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:center;text-align:center}
.try p{margin:0;flex-basis:100%;color:#3d3c38;font-size:.92rem}
.owner .btn{border-color:#121212}
.owner .btn:hover:not(:disabled){background:#121212;color:#f1efe9}
.owner .btn.fill{background:#121212;color:#f1efe9}
.owner .btn.fill:hover:not(:disabled){background:transparent;color:#121212}


/* photo sections */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,70px);align-items:center}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.split h2{font-size:clamp(1.6rem,4.4vw,2.6rem);margin:16px 0 18px}
.split p{color:var(--fg-soft);margin:0 0 22px;max-width:52ch}
.locs{display:grid;gap:14px;margin-bottom:26px}
.locs b{display:block;font-size:.68rem;font-stretch:125%;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.locs span{color:var(--muted);font-size:.86rem}
.ph-frame{position:relative;overflow:hidden;background:var(--surface);cursor:zoom-in;transition:transform .6s cubic-bezier(.2,.8,.2,1);will-change:transform;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border:none;padding:0;display:block;width:100%}
.ph-frame img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08) brightness(.86);transform:scale(1.001);transition:transform 1.1s cubic-bezier(.2,.8,.2,1),filter .6s}
.ph-frame::after{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none;mix-blend-mode:screen}
.ph-frame::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.0);z-index:1;transition:border-color .5s,inset .5s;pointer-events:none}
.ph-frame:hover img,.ph-frame.press img{transform:scale(1.07);filter:grayscale(1) contrast(1.15) brightness(1)}
.ph-frame:hover::after,.ph-frame.press::after{opacity:1}
.ph-frame:hover::before,.ph-frame.press::before{border-color:rgba(255,255,255,.55);inset:14px}
.ph-frame.press{transform:scale(.975)}
.split .ph-frame{aspect-ratio:900/993;max-width:100%}
.gal{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:clamp(240px,34vw,460px) clamp(190px,25vw,340px);gap:12px}
.gal .a{grid-column:span 3}.gal .b{grid-column:span 3}.gal .s{grid-column:span 2}
.gal .ph-frame{height:100%;aspect-ratio:auto}
@media(max-width:700px){.gal{grid-template-columns:1fr 1fr;grid-template-rows:62vw 62vw 44vw 44vw;gap:8px}.gal .a,.gal .b{grid-column:span 2}.gal .s{grid-column:span 1}.gal .s:last-child{grid-column:span 2;grid-row:auto}.gal{grid-template-rows:62vw 52vw 44vw 52vw}}
.team3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:clamp(30px,5vw,48px)}
.team3 .ph-frame{aspect-ratio:820/1054}
@media(max-width:600px){.team3{gap:6px}}
.hist p{max-width:70ch;margin:0 auto;color:var(--fg-soft);text-align:center}
.js .reveal{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.js .reveal.in{opacity:1;transform:none}
.js .ph-frame.reveal{opacity:1;transform:none;clip-path:inset(100% 0 0 0);transition:clip-path 1.2s cubic-bezier(.77,0,.18,1),transform .6s cubic-bezier(.2,.8,.2,1)}
.js .ph-frame.reveal img{transform:scale(1.3)}
.js .ph-frame.reveal.in{clip-path:inset(0 0 0 0)}
.js .ph-frame.reveal.in img{transform:scale(1.001)}
.js .ph-frame.reveal.in:hover img,.js .ph-frame.reveal.in.press img{transform:scale(1.07)}
/* split words */
.sw-w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.sw-w>span{display:inline-block;transform:translateY(105%);transition:transform .9s cubic-bezier(.2,.85,.25,1)}
.split-in .sw-w>span{transform:none}
.hero h1 .ch{display:inline-block;animation:rise 1s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(.35s + var(--i)*40ms)}
@keyframes rise{from{transform:translateY(60%) rotateX(-70deg);opacity:0;filter:blur(6px)}}
.hero h1{perspective:600px}
.hero h1 .wd{display:inline-block;white-space:nowrap}
/* shine on primary buttons */
.btn.fill{position:relative;overflow:hidden}
.btn.fill::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite 2s}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
/* marquee band */
.band{margin-bottom:clamp(48px,8vw,96px);overflow:hidden;border-block:1px solid var(--line);padding-block:clamp(16px,2.6vw,28px);display:grid;gap:6px;user-select:none}
.band .trk{display:flex;width:max-content;will-change:transform}
.band .it{font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(2rem,7vw,5.2rem);line-height:1.05;white-space:nowrap;padding-right:.6em;display:inline-flex;align-items:center;gap:.6em}
.band .trk.o .it{color:transparent;-webkit-text-stroke:1px rgba(243,243,241,.55)}
.band .it i{display:inline-block;width:.32em;height:.32em;border:1.5px solid var(--fg);transform:rotate(45deg)}
/* scroll progress */
.prog-top{position:fixed;z-index:34;left:0;right:0;top:env(safe-area-inset-top,0px);height:2px;background:var(--fg);transform-origin:left;transform:scaleX(0);pointer-events:none}
/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(6,6,6,.96);display:none;align-items:center;justify-content:center;touch-action:pan-y}
.lb.open{display:flex}
.lb img{max-width:min(92vw,1100px);max-height:82vh;object-fit:contain;filter:grayscale(1) contrast(1.08);animation:lbin .45s cubic-bezier(.2,.8,.2,1);user-select:none;-webkit-user-drag:none}
@keyframes lbin{from{opacity:0;transform:scale(.94)}}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:var(--bg)}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:1px solid var(--line-2);display:grid;place-items:center;background:var(--bg)}
.lb .nv:hover{background:var(--fg);color:var(--bg)}
.lb .pv{left:calc(14px + env(safe-area-inset-left,0px))}.lb .nx{right:calc(14px + env(safe-area-inset-right,0px))}
.lb .cnt2{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:.7rem;font-stretch:125%;letter-spacing:.2em;color:var(--muted)}
@media(max-width:600px){.lb .nv{display:none}}
@media (prefers-reduced-motion:reduce){
 .js .reveal,.js .ph-frame.reveal{opacity:1;transform:none;clip-path:none}
 .js .ph-frame.reveal img{transform:none}
 .sw-w>span{transform:none}.hero h1 .ch{animation:none}.btn.fill::after{display:none}
}

footer{border-top:1px solid var(--line);padding-block:44px 40px;text-align:center}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:left;margin-bottom:34px}
@media(max-width:720px){.fg{grid-template-columns:1fr}}
.fg b{display:block;font-size:.66rem;font-stretch:125%;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
.fg span{display:block;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
footer .wm{margin:0 auto 14px;justify-content:center}
footer small{color:var(--muted);font-size:.72rem}

/* drawer (booking) */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:51;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg-2);border-left:1px solid var(--line-2);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .42s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:.95rem;letter-spacing:.16em;margin-right:auto}
.x{width:40px;height:40px;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;transition:var(--t)}
.x:hover{background:var(--fg);color:var(--bg)}
.prog{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:12px 20px 0}
.prog div{height:3px;background:var(--line-2);transition:background .3s}
.prog div.on{background:var(--fg)}
.prog-l{display:flex;justify-content:space-between;padding:8px 20px 0;font-size:.6rem;font-stretch:125%;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prog-l span.on{color:var(--fg)}
@media(max-width:420px){.prog-l span:not(.on){visibility:hidden}}
.db{flex:1;overflow-y:auto;padding:22px 20px 28px;overscroll-behavior:contain}
.q{font-size:1.05rem;letter-spacing:.08em;margin-bottom:18px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line-2);background:var(--surface);transition:border-color var(--t),background var(--t);min-height:56px}
.opt:hover{border-color:var(--fg-soft)}
.opt[aria-pressed="true"]{border-color:var(--fg);background:var(--surface-2)}
.opt .av{width:42px;height:42px;display:grid;place-items:center;flex:none;font-family:var(--serif);font-size:1.25rem;border:1px solid var(--line-2);background:var(--bg)}
.opt[aria-pressed="true"] .av{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:600;font-size:.95rem}
.opt .t small{display:block;color:var(--muted);font-size:.78rem}

  g+=`<div class="ap ${b.isNew?"new":b.paid?"paid":"pend"}" style="grid-row:${b.u-G0+2}/span ${b.n};grid-column:${ci+2}" title="${esc(b.cl)} · ${sn(sv)} · ${U(b.u)}"><b>${b.isNew?`<span class="nb">${t("nb")}</span>`:""}${sn(sv)}</b><small>${U(b.u)}–${U(b.u+b.n)} · ${esc(b.cl)}</small></div>`});
 g+=`</div></div><div class="legend"><span><i style="border-color:var(--ok);background:var(--ok-bg)"></i>${t("lg_paid")}</span><span><i style="border-color:var(--warn);background:var(--warn-bg)"></i>${t("lg_pend")}</span><span><i style="border-color:var(--new);background:#152036"></i>${t("lg_new")}</span></div>`;
 body.innerHTML=g;
 const dd=document.querySelector("#pDays [aria-pressed=true]");if(dd)dd.scrollIntoView({inline:"nearest",block:"nearest"})}
function toggleB(id){const b=SALONS[P.salon].barbers[id];b.on=!b.on;if(W.salon===P.salon&&W.barber===id){W.barber=null;W.slot=null}renderP()}
let tt=null;function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),3200)}

/* ---------- motion ---------- */
document.getElementById("neon").innerHTML=[..."SZTUKA"].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join("");
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el){if(RM)return;const to=+el.dataset.to,dec=+(el.dataset.dec||0),suf=el.dataset.suf||"",t0=performance.now(),D=1500;
 const f=n=>(dec?n.toFixed(dec).replace(".",","):Math.round(n))+suf;
 const tick=n=>{const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);countUp(e.target)}}),{threshold:.5});
document.querySelectorAll(".cnt").forEach(el=>io.observe(el));
document.documentElement.classList.add("js");
const ro=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");ro.unobserve(e.target)}}),{threshold:.12,rootMargin:"0px 0px -40px 0px"});
document.querySelectorAll(".reveal:not(.ph-frame)").forEach((el,i)=>{el.style.transitionDelay=(i%3)*90+"ms";ro.observe(el)});
// clip-path hides the frame itself from IntersectionObserver, so watch its parent
const pro=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;pro.unobserve(e.target);[...e.target.querySelectorAll(":scope > .ph-frame.reveal, :scope > * > .ph-frame.reveal")].forEach((f,i)=>setTimeout(()=>f.classList.add("in"),i*120))}),{threshold:.08});
new Set([...document.querySelectorAll(".ph-frame.reveal")].map(f=>f.closest(".gal,.team3,.split")||f.parentElement)).forEach(c=>pro.observe(c));

document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(W.open)closeBook();else if(P.open)closePanel()}
 if(e.key==="Tab"&&(W.open||P.open)){const root=W.open?document.getElementById("drawer"):document.getElementById("panel");const f=[...root.querySelectorAll("button:not([disabled]),input:not([disabled])")].filter(x=>x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});


/* ---------- fx ---------- */
const FINE=matchMedia("(hover:hover) and (pointer:fine)").matches;
// hero letters
(()=>{const h1=document.querySelector(".hero h1");const txt=h1.textContent;h1.setAttribute("aria-label",txt);let k=0;h1.innerHTML=txt.split(" ").map(w=>`<span class="wd" aria-hidden="true">${[...w].map(c=>`<span class="ch" style="--i:${k++}">${c}</span>`).join("")}</span>`).join(" ")})();
// split headings into words, reveal on scroll
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("split-in");e.target.dataset.seen=1;so.unobserve(e.target)}}),{threshold:.3});
function splitHeads(){document.querySelectorAll(".sec-head h2,.split h2").forEach(el=>{const t=el.textContent;el.setAttribute("aria-label",t);el.innerHTML=t.split(" ").map((w,i)=>`<span class="sw-w" aria-hidden="true"><span style="transition-delay:${i*70}ms">${w}</span></span>`).join(" ");if(RM||el.dataset.seen)el.classList.add("split-in");else so.observe(el)})}
// marquee bands with scroll velocity
const BAND=["Sztuka","Master Barber","Floriańska 24","Krowodrza","Skarżysko","Fade","Hot Broda","Nowy wymiar rzemiosła"];
const tracks=[...document.querySelectorAll(".band .trk")];
tracks.forEach((t,k)=>{const set=(k%2?BAND.slice().reverse():BAND).map(w=>`<span class="it">${w}<i></i></span>`).join("");t.innerHTML=set+set;t._x=k%2?-t.scrollWidth/4:0});
let lastY=scrollY,vel=0;
function loop(){const y=scrollY;vel=vel*.9+(y-lastY)*.1;lastY=y;
 const pr=document.getElementById("progTop");const max=document.documentElement.scrollHeight-innerHeight;pr.style.transform=`scaleX(${max>0?y/max:0})`;
 if(!RM)tracks.forEach(t=>{const d=+t.dataset.dir,w=t.scrollWidth/2;t._x-=d*(0.6+Math.abs(vel)*.35);if(t._x<=-w)t._x+=w;if(t._x>0)t._x-=w;t.style.transform=`translate3d(${t._x}px,0,0)`});
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// photo tilt + spotlight + press + lightbox
const PH=[...document.querySelectorAll(".ph-frame")];
PH.forEach((el,i)=>{
 el.addEventListener("pointermove",e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;el.style.setProperty("--mx",x*100+"%");el.style.setProperty("--my",y*100+"%");
  if(FINE&&!RM&&e.pointerType==="mouse")el.style.transform=`perspective(900px) rotateX(${(.5-y)*7}deg) rotateY(${(x-.5)*9}deg) scale(1.015)`});
 el.addEventListener("pointerleave",()=>{el.style.transform="";el.classList.remove("press")});
 el.addEventListener("pointerdown",e=>{const r=el.getBoundingClientRect();el.style.setProperty("--mx",(e.clientX-r.left)/r.width*100+"%");el.style.setProperty("--my",(e.clientY-r.top)/r.height*100+"%");el.classList.add("press")});
 ["pointerup","pointercancel"].forEach(ev=>el.addEventListener(ev,()=>setTimeout(()=>el.classList.remove("press"),160)));
 el.addEventListener("click",()=>openLb(i));
});
let LBi=0,lbFocus=null;
function openLb(i){LBi=i;lbFocus=document.activeElement;showLb();document.getElementById("lb").classList.add("open");document.body.style.overflow="hidden";document.querySelector("#lb .x").focus()}
function showLb(){const im=PH[LBi].querySelector("img"),t=document.getElementById("lbImg");t.style.animation="none";t.offsetHeight;t.style.animation="";t.src=im.src;t.alt=im.alt;document.getElementById("lbCnt").textContent=`${LBi+1} / ${PH.length}`}
function lbGo(d){LBi=(LBi+d+PH.length)%PH.length;showLb()}
function closeLb(){const l=document.getElementById("lb");if(!l.classList.contains("open"))return;l.classList.remove("open");if(!W.open&&!P.open)document.body.style.overflow="";if(lbFocus)lbFocus.focus()}
(()=>{const l=document.getElementById("lb");let sx=null;l.addEventListener("pointerdown",e=>{sx=e.clientX});l.addEventListener("pointerup",e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)lbGo(dx<0?1:-1)});
 l.addEventListener("click",e=>{if(e.target===l)closeLb()});
 document.addEventListener("keydown",e=>{if(!l.classList.contains("open"))return;if(e.key==="Escape"){e.stopImmediatePropagation();closeLb()}if(e.key==="ArrowRight")lbGo(1);if(e.key==="ArrowLeft")lbGo(-1)},true)})();
// magnetic buttons
if(FINE&&!RM)document.querySelectorAll(".hero .btn,.try .btn,.split .btn").forEach(b=>{b.addEventListener("pointermove",e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.35}px) rotate(-1.5deg)`});b.addEventListener("pointerleave",()=>b.style.transform="")});

applyI18n();
if(location.hash==="#rezerwacja")openBook({});
if(location.hash==="#panel")openPanel();
